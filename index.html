function textCanvas(s,col,sh){
  const k=s+col+sh; if(txtC[k])return txtC[k];

  for(let pass=0;pass<2;pass++){

      const gl=(F[s[i]]||F[' ']).split(' ');
      for(let r=0;r<7;r++)for(let q=0;q<5;q++)if(gl[r][q]==='1')x.fillRect(i*6+q+(pass===0?1:0),r+(pass===0?1:0),1,1);

}

}

  for(let y=by0,row=0;y<by1;y+=5,row++){const off=(row%2)*6;
    for(let x=bx0-off;x<bx1;x+=12){const x0=Math.max(x,bx0),x1=Math.min(x+11,bx1);
      if(x1>x0){rc(x0,y,x1-x0,4,['#9b3f30','#a84a38','#8c3628'][(r()*3)|0]);rc(x0,y,x1-x0,1,'#b9573f')}}}
  rc(62,148,56,42,'#120806');rc(64,146,52,2,'#120806');

  for(let y=152;y<188;y+=6)rc(64,y,52,1,'#2a130e');
  rc(58,142,64,4,'#5d5750');rc(58,142,64,1,'#8a847c');

  rc(40,120,100,8,'#5a3a22');rc(40,120,100,2,'#8a5c34');rc(40,128,100,2,'#2e1c10');

  rc(77,78,26,34,'#c8901a');rc(78,79,24,32,'#f9dfe5');

  // bougies, plante, cadeau
  [[54],[122]].forEach(([x])=>{rc(x,108,4,12,'#f4efe6');rc(x+2,108,2,12,'#d9d0c2');rc(x-2,119,8,1,'#c8901a')});
  rc(62,112,8,8,'#a8552e');rc(60,104,4,8,'#2f8f46');rc(64,100,3,12,'#3aa857');rc(67,105,4,7,'#2f8f46');
  rc(108,111,10,9,'#d63a4a');rc(112,111,2,9,'#ffd23f');rc(108,114,10,2,'#ffd23f');rc(110,109,3,2,'#ffd23f');rc(113,109,3,2,'#ffd23f');

    for(let x=rx+14+ox;x<rx+rw-18;x+=14){const y=ry+30+oy;
      rc(x+2,y-2,1,1,'#c2566b');rc(x+1,y-1,3,1,'#c2566b');rc(x,y,5,1,'#c2566b');rc(x+1,y+1,3,1,'#c2566b');rc(x+2,y+2,1,1,'#c2566b')}}

let sceneBG=null;

/* ---------- musique ---------- */
const SONG=[];
(()=>{const P=[[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2]],[[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2]],[[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,.5],[69,1.5]],[[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]]];
  let b=0;P.forEach(ph=>{ph.forEach(([m,d])=>{SONG.push({m,s:b,d});b+=d});b+=.25});SONG.total=b})();
const BEAT=.5,T0=1.6;
SONG.forEach(n=>{n.t=T0+n.s*BEAT;n.e=n.t+n.d*BEAT*.94});
const MUSIC_END=T0+SONG.total*BEAT,POP_T=MUSIC_END+.1;

let ac=null,master=null,reverbIn=null,noiseBuf=null;
function initAudio(){
  if(!ac){
    try{
      ac=new(window.AudioContext||window.webkitAudioContext)();
      const comp=ac.createDynamicsCompressor();
      master=ac.createGain();master.gain.value=.8;master.connect(comp);comp.connect(ac.destination);
      const len=(ac.sampleRate*1.6)|0,ir=ac.createBuffer(2,len,ac.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
      reverbIn=ac.createConvolver();reverbIn.buffer=ir;const wet=ac.createGain();wet.gain.value=.28;reverbIn.connect(wet);wet.connect(master);
      noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
      const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);
    }catch(e){ac=null}
  }
  if(ac&&ac.state==='suspended')ac.resume();
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function sax(f,t0,dur){
  const o1=ac.createOscillator(),o2=ac.createOscillator(),g2=ac.createGain(),lp=ac.createBiquadFilter(),env=ac.createGain();
  o1.type='sawtooth';o2.type='square';o2.detune.value=6;g2.gain.value=.35;
  [o1,o2].forEach(o=>{o.frequency.setValueAtTime(f*.975,t0);o.frequency.linearRampToValueAtTime(f,t0+.05)});
  lp.type='lowpass';lp.Q.value=2.5;
  lp.frequency.setValueAtTime(700,t0);lp.frequency.linearRampToValueAtTime(2600,t0+.07);lp.frequency.linearRampToValueAtTime(1500,t0+.35);
  const a=Math.min(.04,dur*.3),re=Math.max(t0+dur-.06,t0+a+.01);
  env.gain.setValueAtTime(.0001,t0);env.gain.linearRampToValueAtTime(.5,t0+a);env.gain.linearRampToValueAtTime(.4,Math.max(re-.01,t0+a+.005));env.gain.linearRampToValueAtTime(.0001,t0+dur);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t0);lg.gain.linearRampToValueAtTime(14,t0+.3);
  lfo.connect(lg);lg.connect(o1.detune);lg.connect(o2.detune);
  const n=ac.createBufferSource();n.buffer=noiseBuf;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2500;bp.Q.value=.8;
  const ng=ac.createGain();ng.gain.setValueAtTime(.12,t0);ng.gain.exponentialRampToValueAtTime(.02,t0+dur);
  n.connect(bp);bp.connect(ng);ng.connect(env);
  o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(env);env.connect(master);env.connect(reverbIn);
  [o1,o2,lfo].forEach(o=>{o.start(t0);o.stop(t0+dur+.1)});n.start(t0,Math.random());n.stop(t0+dur+.1);
}
function pop(t0){
  const n=ac.createBufferSource();n.buffer=noiseBuf;const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;
  const g=ac.createGain();g.gain.setValueAtTime(1,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.09);
  n.connect(hp);hp.connect(g);g.connect(master);n.start(t0);n.stop(t0+.12);
  const o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(220,t0);o.frequency.exponentialRampToValueAtTime(45,t0+.12);
  og.gain.setValueAtTime(.9,t0);og.gain.exponentialRampToValueAtTime(.001,t0+.15);o.connect(og);og.connect(master);o.start(t0);o.stop(t0+.2);
}
function rustle(t0){
  const n=ac.createBufferSource();n.buffer=noiseBuf;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=5500;bp.Q.value=.6;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t0);
  for(let i=0;i<14;i++){const tt=t0+i*.1+Math.random()*.05;g.gain.linearRampToValueAtTime(.12*(1-i/16),tt);g.gain.linearRampToValueAtTime(.01,tt+.05)}
  g.gain.linearRampToValueAtTime(.0001,t0+1.6);
  n.connect(bp);bp.connect(g);g.connect(master);n.start(t0,.3);n.stop(t0+1.7);
}
function scheduleAudio(){
  if(!ac)return;const a0=ac.currentTime+.08;
  SONG.forEach(n=>sax(hz(n.m),a0+n.t,n.d*BEAT*.94));
  pop(a0+POP_T);pop(a0+POP_T+.22);rustle(a0+POP_T+.3);
}

function box(x,y,w,h){

  rc(x+2,y+1,w-4,h-2,'#0d1240');rc(x+1,y+2,w-2,h-4,'#0d1240');

function dialog(lines,cols,key){
  if(dlgKey!==key){dlgKey=key;dlgT0=time}
  box(6,BOX_Y,168,34);
  let n=Math.floor((time-dlgT0)*30);
  lines.forEach((s,i)=>{if(n<=0)return;text(s.slice(0,n),12,BOX_Y+6+i*9,cols[i]||'#fff','#000');n-=s.length});

/* ---------- ecran de selection ---------- */
function drawSelect(t){
  rc(0,0,W,H,'#140b2e');
  for(let y=0;y<H;y+=24)rc(0,y,W,12,'#180e36');
  for(const s of stars){const tw=Math.sin(t*2.2+s.p)>.55;rc(s.x,s.y,tw?2:1,tw?2:1,tw?'#fff':'#5e4fa0')}
  for(let i=0;i<9;i++){
    const y=H-((t*13+i*41)%(H+20)),x=(i*53)%W+Math.sin(t*1.3+i)*5;
    G.globalAlpha=.55;G.drawImage(heart(HCOL[i%3],i%2===0),Math.round(x),Math.round(y));G.globalAlpha=1;
  }
  textC('CHOISIS TON',12,'#ffd23f','#8a3a00',2);
  textC('PERSONNAGE',30,'#ffd23f','#8a3a00',2);
  const cx=24,cy=56,cw=132,ch=172;
  rc(cx,cy,cw,ch,'#ffd23f');rc(cx+2,cy+2,cw-4,ch-4,'#2a1a5e');
  rc(46,66,88,110,'#fff');rc(47,67,86,108,'#5a3aa8');rc(47,67,86,3,'#6f4cc7');
  for(let y=70;y<175;y+=8)for(let x=47+((y/8|0)%2)*8;x<133;x+=16)rc(x,y,Math.min(8,133-x),Math.min(8,175-y),'#5233a0');
  const bob=(Math.floor(t*2.5)%2)?2:0,blink=(t%3.4)>3.25;
  G.drawImage(head('bibi',blink,false,5),50,70+bob);
  textC('BIBI',182,'#fff','#2a1a5e',2);
  rc(cx+10,201,cw-20,1,'#ffd23f');
  textC('^ LOVE YOU FOREVER ^',210,'#ff8fc0','#5a0f3a',1);
  rc(cx-2,cy-8,18,10,'#e0393e');text('P1',cx+1,cy-6,'#fff','#600');
  const o=Math.floor(t*3)%2?1:0,c='#fff';
  [[cx-4-o,cy-4-o,1,1],[cx+cw+3+o,cy-4-o,-1,1],[cx-4-o,cy+ch+3+o,1,-1],[cx+cw+3+o,cy+ch+3+o,-1,-1]].forEach(([x,y,dx,dy])=>{
    rc(dx>0?x:x-5,y,6,2,c);rc(x,dy>0?y:y-5,2,6,c)});
  textC('APPUIE POUR',246,'#cbbcff','#000',1);
  if(Math.floor(t*2)%2===0)textC('COMMENCER',259,'#fff','#e0393e',2);
  textC('& ACTIVE LE SON &',298,'#9a8fd0','#000',1);
}

/* ---------- scene ---------- */
const SHIRTB='#c5d3ee',SHIRTB2='#a3b6d8',SKINB='#e8b48f',JEANS='#3b5a86',JEANS2='#2f4a70',SHOEB='#2a1d17';
const SAX='#c2a477',SAX_L='#efe3c8',SAX_D='#8a6e47';
const SK='#f3cfb5',CREAM='#efe6d0',CREAM2='#d8ccb0',NAVY='#1f2a4a';
const BX=28,BY=218,SX=112,SY=222;
function drawBibi(x,y,t,st,blink){
  let b=0;if(st===1)b=Math.floor(t*7)%2;else if(st===2)b=Math.round(Math.abs(Math.sin(t*7))*3);
  const hy=y-b;
  rc(x+1,y+47,26,2,'rgba(0,0,0,.25)');
  rc(x+3,y+30,5,17,JEANS);rc(x+9,y+30,5,17,JEANS);rc(x+8,y+34,1,13,JEANS2);
  rc(x+2,y+45,6,3,SHOEB);rc(x+9,y+45,6,3,SHOEB);
  rc(x+1,hy+20,14,15,SHIRTB);rc(x+1,hy+31,14,4,SHIRTB2);
  for(let i=0;i<11;i++)rc(x+7+i,hy+20+(i>>1),1,1,'#1b2330');
  G.drawImage(head('bibi',blink,false,1),x,hy);
  rc(x+9,hy+13,9,2,SAX);rc(x+9,hy+13,9,1,SAX_L);
  rc(x+16,hy+15,4,2,SAX);
  rc(x+17,hy+17,1,24,SAX_L);rc(x+18,hy+17,1,24,SAX);rc(x+19,hy+17,1,24,SAX_D);
  rc(x+17,hy+41,9,3,SAX);rc(x+17,hy+43,9,1,SAX_D);
  rc(x+22,hy+38,4,3,SAX);rc(x+25,hy+38,1,3,SAX_D);
  rc(x+21,hy+36,7,2,SAX);rc(x+27,hy+36,1,2,SAX_D);
  rc(x+22,hy+35,5,1,'#4a3318');
  [22,26,30,34].forEach(k=>rc(x+18,hy+k,1,1,SAX_L));
  rc(x-1,hy+21,3,8,SHIRTB);rc(x+2,hy+28,13,3,SHIRTB2);rc(x+15,hy+28,4,3,SKINB);rc(x+2,hy+28,2,3,'#7fa3d9');
  rc(x+13,hy+21,3,4,SHIRTB);rc(x+14,hy+23,4,3,SHIRTB);rc(x+17,hy+23,3,3,SKINB);
  rc(x+7,hy+13,3,2,'#222');
  return {bx:x+24,by:hy+34};
}
function drawSam(x,y,t,st,open,blink){
  let b=0;if(st===1)b=Math.floor(t*7+1)%2;else if(st===2)b=Math.round(Math.abs(Math.sin(t*7+1))*3);
  const hy=y-b;
  rc(x+1,y+43,16,2,'rgba(0,0,0,.25)');
  rc(x+1,hy+12,14,19,'#8f2a14');rc(x+3,hy+16,1,12,'#a3321a');rc(x+12,hy+18,1,10,'#a3321a');rc(x+5,hy+22,1,8,'#b8441f');
  rc(x+1,hy+30,3,2,'#8f2a14');rc(x+12,hy+30,3,2,'#8f2a14');
  rc(x+5,y+36,3,7,SK);rc(x+9,y+36,3,7,SK);rc(x+4,y+41,4,3,'#2a2a2a');rc(x+9,y+41,4,3,'#2a2a2a');
  rc(x+4,hy+16,8,11,CREAM);rc(x+6,hy+17,4,2,SK);rc(x+5,hy+16,6,1,NAVY);rc(x+4,hy+16,1,5,NAVY);rc(x+11,hy+16,1,5,NAVY);
  rc(x+4,hy+26,8,1,NAVY);
  rc(x+3,hy+27,10,4,CREAM);rc(x+2,hy+31,12,4,CREAM);rc(x+1,hy+35,14,3,CREAM);rc(x+1,hy+37,14,1,NAVY);rc(x+5,hy+31,1,3,CREAM2);rc(x+10,hy+32,1,3,CREAM2);
  G.drawImage(head('sam',blink,open,1),x,hy);
  rc(x+2,hy+17,3,5,SK);rc(x+1,hy+14,4,4,SK);
  rc(x+3,hy+13,2,2,'#111');rc(x+4,hy+10,3,3,'#2a2a2a');rc(x+5,hy+11,1,1,'#7a828f');
  if(st===2){rc(x+13,hy+8,3,10,SK);rc(x+13,hy+6,3,3,SK);rc(x+13,hy+13,2,2,'#e0453a');rc(x+13,hy+9,3,1,'#4d9de0')}
  else{rc(x+12,hy+17,3,10,SK);rc(x+12,hy+26,3,2,SK);rc(x+12,hy+19,2,2,'#e0453a');rc(x+14,hy+21,1,1,'#2f6f4a');rc(x+12,hy+24,3,1,'#ffd23f');rc(x+12,hy+25,3,1,'#4d9de0')}
}
function drawFire(t){
  const base=186;
  rc(66,184,48,4,'#7a1d0e');
  for(let i=0;i<12;i++){
    const x=64+i*4,env=.55+.45*Math.cos((i-5.5)/6*Math.PI*.95),n=.5+.5*Math.sin(t*9+i*1.9)*Math.cos(t*5.3+i*.7);
    const h=Math.round((10+22*n)*env/2)*2,h2=Math.round(h*.72/2)*2,h3=Math.round(h*.42/2)*2;
    rc(x,base-h,4,h,'#d6341a');rc(x,base-h2,4,h2,'#ff8a1f');rc(x+1,base-h3,2,h3,'#ffe27a');
  }
  rc(64,184,52,6,'#3b2111');rc(64,184,52,1,'#5e3a1c');rc(70,180,40,5,'#4a2a15');rc(70,180,40,1,'#6b4423');
  rc(62,186,4,4,'#7a5232');rc(114,186,4,4,'#7a5232');
  if(Math.random()<.08)sparks.push({x:70+Math.random()*40,y:170,vx:rnd(-8,8),vy:-rnd(25,45),life:.9,age:0});
  for(const s of sparks){s.age+=0.016;s.x+=s.vx*.016;s.y+=s.vy*.016;rc(s.x,s.y,1,1,s.age<.5?'#ffe27a':'#ff8a1f')}
  sparks=sparks.filter(s=>s.age<s.life);
}
function candles(t){
  [55,123].forEach((x,i)=>{const f=Math.sin(t*12+i*2)>.2?1:0;rc(x,105-f,2,3+f,'#ff9f1c');rc(x,106-f,2,2,'#ffe27a')});
}
function glow(t){
  G.globalAlpha=.09+.03*Math.sin(t*7);
  rc(46,196,88,6,'#ffa040');rc(54,202,72,6,'#ffa040');rc(64,208,52,6,'#ffa040');
  G.globalAlpha=1;
}
const RCOL=[{b:'#f1ece2',s:'#cfc6b8'},{b:'#c9b8a0',s:'#a08f78'},{b:'#8a6a4a',s:'#6b5038'}];
function spawnRabbit(){
  const dir=Math.random()<.5?1:-1;
  rabbits.push({x:dir>0?-14:W+2,y:204+Math.floor(Math.random()*8),dir,ph:0,sit:0,col:RCOL[(Math.random()*3)|0]});
}
function updateRabbits(dt){
  rabT-=dt;if(rabT<=0){if(rabbits.length<2)spawnRabbit();rabT=4+Math.random()*5}
  for(const r of rabbits){
    if(r.sit>0){r.sit-=dt;continue}
    const prev=r.ph;r.ph+=dt/.6;
    if(prev<.55)r.x+=r.dir*26*dt;
    if(r.ph>=1){r.ph-=1;if(Math.random()<.2)r.sit=rnd(.8,1.6)}
  }
  rabbits=rabbits.filter(r=>r.x>-20&&r.x<W+10);
}
function drawRabbit(r){
  const hopping=r.sit<=0&&r.ph<.55,arc=hopping?Math.sin(r.ph/.55*Math.PI)*5:0,st=arc>1.2;
  const ox=Math.floor(r.x),oy=Math.floor(r.y-10-arc),c=r.col;
  const rr=(dx,dy,w,h,col)=>{const x=r.dir>0?ox+dx:ox+12-dx-w;rc(x,oy+dy,w,h,col)};
  G.fillStyle='rgba(0,0,0,.22)';G.fillRect(ox+1,Math.floor(r.y),9,1);
  rr(6,-2,2,5,c.b);rr(9,-2,2,5,c.b);rr(7,-1,1,3,'#f0a6b0');rr(10,-1,1,3,'#f0a6b0');
  rr(6,2,5,5,c.b);rr(11,4,1,1,'#f0a6b0');rr(9,3,1,1,'#1a1a1a');
  if(st){rr(0,5,9,4,c.b);rr(0,8,3,2,c.s);rr(9,8,3,1,c.s);rr(0,5,2,2,'#fff')}
  else{rr(1,5,7,5,c.b);rr(2,4,5,1,c.b);rr(3,9,5,1,c.s);rr(8,9,2,1,c.s);rr(0,6,2,2,'#fff')}
}
function emitHeart(x,y){hearts.push({x,y,vx:(Math.random()-.3)*10,vy:-(16+Math.random()*10),age:0,life:2.6+Math.random()*.8,ph:Math.random()*6,small:Math.random()<.45,col:HCOL[(Math.random()*3)|0]})}
function spawnConf(x,y,vx,vy){confetti.push({x,y,vx,vy,col:CONF[(Math.random()*CONF.length)|0],w:2+(Math.random()<.4?1:0),h:2,age:0,ph:Math.random()*6,land:236+Math.random()*52,term:40+Math.random()*25,landed:false})}
function triggerPop(){
  popped=true;popT=sceneT;flash=.25;
  for(let i=0;i<50;i++){spawnConf(6,262,rnd(20,110),-rnd(100,190));spawnConf(174,262,-rnd(20,110),-rnd(100,190))}
  for(let i=0;i<30;i++)spawnConf(90,250,rnd(-45,45),-rnd(120,200));
}

function drawScene(dt){
  const t=sceneT;
  G.drawImage(sceneBG,0,0);
  drawFire(t);candles(t);glow(t);
  updateRabbits(dt);rabbits.forEach(drawRabbit);
  const st=popped?2:(t>=T0&&t<MUSIC_END?1:0);
  let ni=-1;for(let i=0;i<SONG.length;i++)if(t>=SONG[i].t&&t<SONG[i].e){ni=i;break}
  const blink=(t%3.6)>3.45;
  const open=st===2?(Math.floor(time*4)%2===0):(ni>=0&&(Math.floor(t*10)%3!==2));
  const tip=drawBibi(BX,BY,t,st,blink);
  drawSam(SX,SY,t,st,open,blink);
  if(ni>=0&&ni!==lastNote){emitHeart(tip.bx,tip.by);if(SONG[ni].d>=1)emitHeart(tip.bx-2,tip.by+2);heartAcc=0}
  lastNote=ni;
  if(ni>=0){heartAcc+=dt;if(heartAcc>.4){heartAcc=0;emitHeart(tip.bx,tip.by)}}
  for(const h of hearts){
    h.age+=dt;h.y+=h.vy*dt;h.x+=h.vx*dt;
    const left=h.life-h.age;G.globalAlpha=left<.7?Math.max(0,left/.7):1;
    G.drawImage(heart(h.col,h.small),Math.round(h.x+Math.sin(h.age*3+h.ph)*3),Math.round(h.y));
  }
  G.globalAlpha=1;hearts=hearts.filter(h=>h.age<h.life);
  text('BIBI',BX+2,271,'#fff','#3b2414');text('SAM',SX+4,271,'#fff','#3b2414');
  // pop
  if(!popped&&t>=POP_T)triggerPop();
  if(popped){
    const pt=t-popT;
    if(pt<9){rainAcc+=dt*24;while(rainAcc>=1){rainAcc--;spawnConf(Math.random()*W,-4,rnd(-10,10),rnd(20,40))}}
    for(const c of confetti){
      if(c.landed)continue;
      c.age+=dt;c.vy=Math.min(c.vy+120*dt,c.term);c.vx*=1-1.4*dt;
      c.x+=(c.vx+Math.sin(c.age*5+c.ph)*14)*dt;c.y+=c.vy*dt;
      if(c.y>=c.land){c.y=c.land;c.landed=true}
      c.x=clamp(c.x,0,W-3);
    }
    for(const c of confetti){
      if(c.landed){rc(c.x,c.y,c.w,1,c.col);continue}
      const f=Math.floor((c.age+c.ph)*7)%2;rc(c.x,c.y,f?c.h:c.w,f?c.w:c.h,c.col);
    }
    if(pt<.6&&Math.floor(pt*14)%2===0)textC('POP!',90,'#ffd23f','#c0192e',3);
  }
  if(flash>0){G.globalAlpha=Math.min(.8,flash/.25*.8);rc(0,0,W,H,'#fff');G.globalAlpha=1;flash-=dt}
  if(!popped){
    if(t<T0)dialog(['BIBI SE PREPARE...'],['#fff'],'a');
    else dialog(['& BIBI JOUE POUR SAM &','HAPPY BIRTHDAY'],['#fff','#ff8fc0'],'b');
  }else{
    dialog(['JOYEUX ANNIVERSAIRE','SAM ! ^ ^ ^','> REJOUER'],['#ffd23f','#ff8fc0','#9fd8ff'],'c');
  }
}

/* ---------- transitions ---------- */
function startWipe(kind){if(!wipe)wipe={t:0,kind,phase:0}}
function drawWipe(dt){
  if(!wipe)return;
  wipe.t+=dt;const wt=wipe.phase===0?wipe.t:wipe.t-.6;
  for(let y=0,i=0;y<H;y+=8,i++){
    const p=clamp((wt-(y/H)*.35)/.4,0,1),w=Math.round((wipe.phase===0?p:1-p)*W);
    if(w>0){if(i%2)rc(W-w,y,w,8,'#0b0713');else rc(0,y,w,8,'#0b0713')}
  }
  if(wipe.phase===0&&wipe.t>=.8){
    wipe.phase=1;wipe.t=.6;
    if(wipe.kind==='scene'){mode='scene';if(!sceneBG)sceneBG=buildScene()}
    resetScene();
  }else if(wipe.phase===1&&wipe.t>=1.4)wipe=null;
}

/* ---------- boucle ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  G=main;
  if(mode==='select')drawSelect(time);
  else{sceneT=(now-sceneStart)/1000;drawScene(dt)}
  drawWipe(dt);
  requestAnimationFrame(frame);
}
cv.addEventListener('click',e=>{
  if(wipe)return;
  const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*H;
  if(mode==='select'){initAudio();startWipe('scene')}
  else if(popped&&y>=BOX_Y-4){initAudio();startWipe('replay')}
});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();
window.__dbg={skip:()=>{sceneStart-=(POP_T-sceneT)*1000-50},state:()=>mode};
requestAnimationFrame(frame);
})();
</script>
